# Application
spring.application.name=procurement

# PostgreSQL Database Configuration
# Username/password come from config/local.properties (git-ignored) or environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procurement_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# Local machine secrets (git-ignored). Values there override the ones above.
spring.config.import=optional:file:./config/local.properties

# JPA / Hibernate - Flyway creates the tables (src/main/resources/db/migration), Hibernate only checks them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Load related rows (photos, suppliers) in batches instead of one query per item
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway
spring.flyway.enabled=true

# Server port - 8080 is taken by the local Oracle listener on this machine
server.port=${SERVER_PORT:8081}

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Login token (JWT) ----------
# Secret must be at least 32 characters. Put the real one in config/local.properties.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=12

# ---------- File uploads (product photos / short videos) ----------
app.upload-dir=./uploads
app.max-image-mb=5
app.max-video-mb=50
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# ---------- First admin account (created on startup if no admin exists) ----------
app.admin.email=admin@procureai.com
app.admin.password=Admin@123
app.admin.name=Platform Admin

# ---------- Demo data (sample suppliers, buyers, products and orders) ----------
# Loaded once into an empty database. Set to false for a clean start.
app.seed-demo-data=true

# Allowed browser origin for the React app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Spring AI (OpenAI) - not used yet; the placeholder only lets the app start.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
