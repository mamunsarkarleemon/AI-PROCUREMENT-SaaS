# Application
spring.application.name=procurement

# PostgreSQL Database Configuration
# Credentials come from environment variables - never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procurement_db}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# Local machine secrets (git-ignored). Values there override the ones above.
spring.config.import=optional:file:./config/local.properties

# JPA / Hibernate Configuration
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# Server port - 8080 is taken by the local Oracle XML DB listener; override with $env:SERVER_PORT
server.port=${SERVER_PORT:8081}

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger UI / OpenAPI docs - development only; set both to false in production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Never leak internal details in error responses
server.error.include-message=never
server.error.include-stacktrace=never

# Spring AI (OpenAI) - the starter refuses to start without a key.
# Set OPENAI_API_KEY when AI features are built; the placeholder only lets the app boot.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
